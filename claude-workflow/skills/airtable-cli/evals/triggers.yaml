  - Draw a flowchart in Lucidchart showing our deployment pipeline.
  - Help me derive a formula to calculate compound interest for this financial model.
  - Look up the service catalog entry for our billing microservice.
  - Move ticket ABC-123 to the sprint board and set it to In Progress.
  - Pull the latest test automation results from our last launch in ReportPortal.
  - Show me recent deployment events in the infrastructure event graph for the payments service.
  - Upload this spreadsheet to Google Drive and share it with the team.
  - What skills are available for discovery in this agent setup?
  - Write a SQL query to join the orders table with the customers table in our Postgres database.
